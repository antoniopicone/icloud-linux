[package]
name = "icloudctl"
description = "Command line control tool for icloud-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
icloud-core = { version = "0.2.0", path = "../icloud-core" }
signal-hook = "0.4.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
icloud-api = { path = "../icloud-api", features = ["testing"] }

[lib]
name = "icloudctl"
path = "src/lib.rs"

[[bin]]
name = "icloudctl"
path = "src/main.rs"
