# icloud-linux configuration. Copy to ~/.config/icloud-linux/config.yaml (mode 0600),
# or let `icloudctl init` / `icloud-installer` create it. Every key is optional.
---
# Your Apple ID (email address or phone number).
username: "your_apple_id@example.com"

# OPTIONAL and best left out. With a stored password the service can renew an
# expired session by itself (a trusted session needs no verification code).
# Without it, an expired session means running `icloudctl auth` again, which
# happens every few weeks. If you do store it, keep this file at mode 0600.
#
# password: "your_apple_id_password"

# Where the local mirror and the sync database live.
cache_dir: "~/.cache/icloud-linux"

# Where the iCloud session (cookies, tokens) is kept.
cookie_dir: "~/.config/icloud-linux/cookies"

# How iCloud Drive's contents are discovered.
#   lazy (default) — nothing is crawled up front. A folder is listed from iCloud
#                    the first time it is opened, the way Finder and Files.app
#                    behave. The mount is up in seconds on any drive size, and
#                    listing a folder never downloads the files inside it.
#   full           — crawl the whole drive at startup and on every refresh. Needed
#                    if you want everything indexed without browsing to it, e.g.
#                    `icloudctl hydrate` over folders you never open.
crawl_mode: "lazy"

# When file contents are downloaded. Only matters with crawl_mode: full.
#   lazy       (default) — a file is fetched only when you open it or choose
#                          "Download from iCloud" in the file manager.
#   background — fetch every eligible file in the background once it is known.
#                This puts a copy of the whole drive on the disk.
# With crawl_mode: lazy, files are always fetched on demand.
warmup_mode: "lazy"

# Programs that walk the drive by themselves never trigger a download:
# search indexers (Tracker, LocalSearch, Baloo) are turned away, and
# thumbnailers get a preview only for files up to this many bytes. Bigger
# files show a generic icon until you download them. 0 = no downloads for
# previews at all.
preview_max_bytes: 200000

# What happens when a path changed both here and on iCloud. "copy" keeps the
# local version as "<name>.local-conflict-<timestamp>" and uploads it as a new
# file next to the remote one. Nothing is overwritten silently.
conflict_mode: "copy"

# What deleting something on the mount does on iCloud.
#   trash     (default) — moves it to "Recently Deleted", where it can be recovered.
#   permanent           — removes it for good.
delete_mode: "trash"

# Push local changes to iCloud every N seconds.
upload_interval_seconds: 30

# Re-check remote metadata every N seconds. In lazy mode this also bounds how
# long a listed folder is trusted before it is listed again.
remote_refresh_interval_seconds: 300

# Download workers (1-16). iCloud downloads one file at a time per session, so
# raising this only overlaps bookkeeping, not transfers.
warmup_workers: 1

# Synchronisation boundary.
#
# sync_paths is an allow-list. When set, only these paths have their contents
# downloaded and may be created, written, renamed, moved or deleted through the
# mount. Everything else is still listed (names, sizes) but cannot be read or
# changed: reading fails with EACCES instead of returning empty data.
# Leave it out or empty for no restriction.
#
# exclude_paths is a deny-list, applied first: matching paths are never
# downloaded or changed, even inside a sync_path. Useful for carving a huge
# subfolder out of an allowed one.
#
# sync_paths:
#   - /Downloads
# exclude_paths:
#   - /Downloads/Large Archive

# true (default)  — background threads upload changes and refresh remote
#                   metadata on the schedules above.
# false           — no background polling. The mount serves what it has and
#                   `icloudctl sync` pulls the latest changes on demand. Good for
#                   drives that rarely change.
auto_sync: true

# FUSE mount options.
fuse_options:
  allow_other: false  # let other users see the mount (needs user_allow_other in /etc/fuse.conf)
  ro: false           # mount read-only: every change is refused with EROFS
  nonempty: true      # accepted for compatibility; libfuse 3 always allows this
